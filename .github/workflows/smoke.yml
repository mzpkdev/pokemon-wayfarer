name: Smoke

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR must not be able to change its own classification policy.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Classify changes
        # Bootstrap on a base without the classifier falls back to full CI.
        if: hashFiles('.github/actions/classify-changes/action.yml') != ''
        id: changes
        uses: ./.github/actions/classify-changes

  mgba:
    name: mGBA
    needs: changes
    if: >-
      always() && github.event.pull_request.draft == false &&
      (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-dependencies
        with:
          package-set: base

      - name: Install headless mGBA library
        run: sudo apt-get install --yes --no-install-recommends libmgba-dev

      - name: Build playable debug ROM
        working-directory: game
        run: make -j"$(nproc)" BUILD=wayfarer DEBUG=1 debug

      - name: Boot debug ROM to the main menu with fresh save storage
        run: >-
          python3 game/tools/mgba-boot-smoke/run.py
          game/pokewayfarer.gba game/pokewayfarer.elf
          --output mgba-smoke-results

      - name: Upload mGBA boot diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mgba-smoke-results
          path: mgba-smoke-results
          if-no-files-found: warn

  e2e:
    name: E2E
    needs: changes
    if: >-
      always() && github.event.pull_request.draft == false &&
      (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0

      - name: Set up build and E2E dependencies
        uses: ./.github/actions/setup-build-dependencies
        with:
          package-set: e2e

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install E2E workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build playable E2E ROM
        working-directory: game
        run: make -j"$(nproc)" e2e

      - name: Run SkyEmu smoke tests
        env:
          SKYEMU_ROM: ${{ github.workspace }}/game/pokemon-wayfarer-e2e.gba
          SKYEMU_SYMS: ${{ github.workspace }}/game/pokemon-wayfarer-e2e.sym
        run: pnpm run smoke
