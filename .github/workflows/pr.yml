name: PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Lint pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test

      - name: Validate pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          missing_sections=""
          for section in What Why Impact; do
            if ! grep -qE "^## ${section}[[:space:]]*$" <<<"$PR_BODY"; then
              missing_sections+="${missing_sections:+, }## ${section}"
            fi
          done

          if [ -n "$missing_sections" ]; then
            printf 'Pull request description is missing %s. Use the pull request template.\n' "$missing_sections"
            exit 1
          fi

  devtooling:
    name: Devtooling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: devtooling
        run: pnpm run check

      - name: Test
        working-directory: devtooling
        run: pnpm run test

      - name: Build catalog and app
        working-directory: devtooling
        run: |
          pnpm run clean
          pnpm run build
          node --input-type=module --eval '
            import * as fs from "node:fs"

            for (const catalogPath of [
              "../build/cartographer/map-catalog/catalog.json",
              "../build/cartographer/map-catalog/metatiles/catalog.json",
            ]) {
              JSON.parse(fs.readFileSync(catalogPath, "utf8"))
            }
          '
          test -f ui/dist/index.html

      - name: Install Chromium
        working-directory: devtooling
        run: pnpm dlx playwright@1.58.2 install --with-deps chromium

      - name: Run browser regression
        working-directory: devtooling
        env:
          CI: true
        run: pnpm --filter @wayfarer/ui run e2e
