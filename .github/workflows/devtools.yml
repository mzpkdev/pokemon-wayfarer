name: Devtools

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
      - closed

jobs:
  validate:
    name: Validate
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: devtools
        run: pnpm run check

      - name: Test
        working-directory: devtools
        run: pnpm run test

      - name: Build catalog and app
        working-directory: devtools
        run: |
          pnpm run clean
          pnpm run build
          node --input-type=module --eval '
            import * as fs from "node:fs"

            for (const catalogPath of [
              "../build/cartographer/map-catalog/catalog.json",
              "../build/cartographer/map-catalog/metatiles/catalog.json",
            ]) {
              JSON.parse(fs.readFileSync(catalogPath, "utf8"))
            }
          '
          test -f ui/dist/index.html

      - name: Install Chromium
        working-directory: devtools
        run: pnpm dlx playwright@1.58.2 install --with-deps chromium

      - name: Run browser regression
        working-directory: devtools
        env:
          CI: true
        run: pnpm --filter @wayfarer/ui run e2e

  preview:
    name: Preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (
          (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name == 'preview'
        ) ||
        (
          (github.event.action == 'converted_to_draft' || github.event.action == 'closed') &&
          contains(github.event.pull_request.labels.*.name, 'preview')
        ) ||
        (
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'preview')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: devtools-pages
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pages: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0

      - name: List open same-repository pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_LABEL: preview
        run: |
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | select(.draft == false) | select(any(.labels[]; .name == env.PREVIEW_LABEL)) | [.number, .head.sha] | @tsv' \
            > "$RUNNER_TEMP/wayfarer-preview-refs.tsv"

      - name: Build every open preview
        id: outcome
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PREVIEW_LABEL: preview
          PREVIEW_SITE: ${{ runner.temp }}/wayfarer-preview-site
          PREVIEW_REFS: ${{ runner.temp }}/wayfarer-preview-refs.tsv
          SUCCESSFUL_PREVIEW_REFS: ${{ runner.temp }}/wayfarer-successful-preview-refs.tsv
        run: |
          mkdir -p "$PREVIEW_SITE"
          : > "$SUCCESSFUL_PREVIEW_REFS"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"

          build_preview() {
            number="$1"
            sha="$2"
            checkout="$RUNNER_TEMP/wayfarer-preview-pr-${number}"
            site="$PREVIEW_SITE/preview/pr-${number}"

            git init --quiet "$checkout" || return 1
            git -C "$checkout" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" || return 1
            git -C "$checkout" -c "http.extraheader=AUTHORIZATION: basic ${authorization}" \
              fetch --depth=1 origin "$sha" || return 1
            git -C "$checkout" checkout --quiet --detach FETCH_HEAD || return 1

            pnpm --dir "$checkout" install --frozen-lockfile || return 1
            pnpm --dir "$checkout/devtools" run build || return 1

            mkdir -p "$site" || return 1
            cp -a "$checkout/build/cartographer/map-catalog/." "$site/" || return 1
            test -f "$site/index.html"
          }

          while IFS=$'\t' read -r number sha; do
            [ -n "$number" ] || continue
            if build_preview "$number" "$sha"; then
              printf '%s\t%s\n' "$number" "$sha" >> "$SUCCESSFUL_PREVIEW_REFS"
            else
              rm -rf "$PREVIEW_SITE/preview/pr-${number}"
              printf '::warning title=Preview build failed::Pull request #%s was excluded from this deployment.\n' "$number"
            fi
          done < "$PREVIEW_REFS"

          if [ "$EVENT_ACTION" = closed ]; then
            status=closed
          elif [ "$EVENT_ACTION" = unlabeled ] && [ "$EVENT_LABEL" = "$PREVIEW_LABEL" ]; then
            status=removed
          elif [ "$PR_DRAFT" = true ]; then
            status=draft
          elif awk -F '\t' -v number="$PR_NUMBER" '$1 == number { found = 1 } END { exit !found }' "$SUCCESSFUL_PREVIEW_REFS"; then
            status=ready
          else
            status=unavailable
          fi
          printf 'trigger_preview_status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Write preview index and enforce Pages size budget
        env:
          PREVIEW_SITE: ${{ runner.temp }}/wayfarer-preview-site
          SUCCESSFUL_PREVIEW_REFS: ${{ runner.temp }}/wayfarer-successful-preview-refs.tsv
        run: |
          node devtools/scripts/pages-preview.mjs index \
            --output "$PREVIEW_SITE" \
            --previews "$SUCCESSFUL_PREVIEW_REFS"
          node devtools/scripts/pages-preview.mjs guard --directory "$PREVIEW_SITE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/wayfarer-preview-site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Create or update preview comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
          PREVIEW_STATUS: ${{ steps.outcome.outputs.trigger_preview_status }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          marker='<!-- devtools-preview -->'
          preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/preview/pr-${PR_NUMBER}/"
          docs_url="${preview_url}#docs"

          if [ "$EVENT_ACTION" = closed ] && [ "$DEPLOYMENT_RESULT" = success ]; then
            body="${marker}"$'\n'"This devtools preview was removed because the pull request is closed."
          elif [ "$EVENT_ACTION" = closed ]; then
            body="${marker}"$'\n'"This pull request is closed, but preview removal is pending because the Pages deployment did not complete."
          elif [ "$DEPLOYMENT_RESULT" = success ] && [ "$PREVIEW_STATUS" = removed ]; then
            body="${marker}"$'\n'"This devtools preview was removed because the preview label was removed."
          elif [ "$DEPLOYMENT_RESULT" = success ] && [ "$PREVIEW_STATUS" = draft ]; then
            body="${marker}"$'\n'"### Devtools"$'\n\n'"The preview will be available when this PR is ready for review."
          elif [ "$DEPLOYMENT_RESULT" = success ] && [ "$PREVIEW_STATUS" = ready ]; then
            body="${marker}"$'\n'"### Devtools"$'\n\n'"[Open the preview for this PR](${preview_url})"$'\n\n'"[Open the product docs](${docs_url})"
          else
            body="${marker}"$'\n'"Devtools preview is unavailable because its Pages build did not complete."
          fi

          comment_id="$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- devtools-preview -->"))) | .id' \
            | head -n 1)"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --raw-field body="$body"
          else
            gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --raw-field body="$body"
          fi
