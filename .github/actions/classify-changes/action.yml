name: Classify PR changes
description: Verify all changed paths before allowing light (docs and website only) validation
outputs:
  light:
    description: True only for a verified, complete PR that changes nothing but documentation and website paths
    value: ${{ steps.classify.outputs.light }}
runs:
  using: composite
  steps:
    - name: Inspect complete PR file list
      id: classify
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/ci_changes.py
